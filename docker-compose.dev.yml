version: "3.9"

services:
  # -------------------------
  # Qdrant (Vector DB)
  # -------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_service
    ports:
      - "2003:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=2
    mem_limit: 256m
    networks:
      - ai_tutor_network
    restart: unless-stopped

  # -------------------------
  # Neo4j (Graph DB)
  # -------------------------
  neo4j:
    image: neo4j:5.17.0
    container_name: neo4j_service
    ports:
      - "2004:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=256m
      - NEO4J_dbms_memory_pagecache_size=256m
    mem_limit: 512m
    networks:
      - ai_tutor_network
    restart: unless-stopped

  # -------------------------
  # Redis (Cache + Judge0)
  # -------------------------
  redis:
    image: redis:7.2-alpine
    container_name: redis_service
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "2005:6379"
    volumes:
      - redis_data:/data
    mem_limit: 128m
    networks:
      - ai_tutor_network
    restart: unless-stopped

